<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>توليد أيقونات quran-player</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0f2027;
            color: #fff;
            text-align: center;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 { color: #ffd700; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        .icon-preview {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .icon-preview img { width: 64px; height: 64px; margin-bottom: 0.5rem; }
        .icon-preview span { font-size: 0.75rem; color: #a0c4d8; display: block; }
        button {
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            color: #0f2027;
        }
        button:hover { transform: scale(1.05); }
        #status { margin-top: 1rem; color: #ffd700; min-height: 2rem; }
    </style>
</head>
<body>
    <h1>🎨 توليد أيقونات quran-player</h1>
    <p>اضغط الزر لتوليد جميع الأحجام وتحميلها</p>

    <div class="grid" id="previews"></div>
    <button id="gen">⬇️ توليد وتحميل كل الأيقونات</button>
    <div id="status"></div>

    <script>
    const SIZES = [
        { size: 72, name: 'icon-72.png' },
        { size: 96, name: 'icon-96.png' },
        { size: 128, name: 'icon-128.png' },
        { size: 144, name: 'icon-144.png' },
        { size: 152, name: 'icon-152.png' },
        { size: 180, name: 'apple-touch-icon.png' },
        { size: 192, name: 'icon-192.png' },
        { size: 256, name: 'icon-256.png' },
        { size: 384, name: 'icon-384.png' },
        { size: 512, name: 'icon-512.png' },
        { size: 16, name: 'favicon-16.png' },
        { size: 32, name: 'favicon-32.png' },
    ];

    const SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#0f2027"/>
                <stop offset="50%" stop-color="#203a43"/>
                <stop offset="100%" stop-color="#2c5364"/>
            </linearGradient>
            <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffe44d"/>
                <stop offset="100%" stop-color="#ffd700"/>
            </linearGradient>
            <radialGradient id="glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffd700" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
            </radialGradient>
        </defs>
        <rect width="512" height="512" rx="110" fill="url(#bg)"/>
        <circle cx="256" cy="256" r="220" fill="url(#glow)"/>
        <g transform="translate(256,256)" opacity="0.15">
            <polygon points="0,-180 50,-50 180,0 50,50 0,180 -50,50 -180,0 -50,-50" fill="#ffd700"/>
            <polygon points="0,-180 50,-50 180,0 50,50 0,180 -50,50 -180,0 -50,-50" fill="#ffd700" transform="rotate(45)"/>
        </g>
        <g transform="translate(256, 240)">
            <path d="M -90,0 Q -90,-90 0,-130 Q 90,-90 90,0 Z" fill="url(#gold)"/>
            <circle cx="0" cy="-145" r="10" fill="#ffe44d"/>
            <circle cx="0" cy="-150" r="6" fill="#0f2027"/>
            <rect x="-125" y="-80" width="16" height="80" fill="#ffd700" rx="3"/>
            <circle cx="-117" cy="-88" r="8" fill="#ffe44d"/>
            <rect x="109" y="-80" width="16" height="80" fill="#ffd700" rx="3"/>
            <circle cx="117" cy="-88" r="8" fill="#ffe44d"/>
            <rect x="-100" y="0" width="200" height="20" fill="url(#gold)" rx="4"/>
            <path d="M -25,20 Q -25,-15 0,-25 Q 25,-15 25,20 Z" fill="#0f2027" opacity="0.7"/>
        </g>
        <g transform="translate(256, 340)">
            <path d="M -60,0 Q -30,-15 0,0 Q 30,-15 60,0 L 60,30 Q 30,15 0,30 Q -30,15 -60,30 Z" fill="#ffd700" opacity="0.9"/>
            <line x1="0" y1="0" x2="0" y2="30" stroke="#0f2027" stroke-width="2"/>
        </g>
    </svg>`;

    const previews = document.getElementById('previews');
    SIZES.forEach(s => {
        const div = document.createElement('div');
        div.className = 'icon-preview';
        div.innerHTML = `<img src="data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(SVG)))}" alt="${s.size}">
                        <span>${s.name}<br>${s.size}×${s.size}</span>`;
        previews.appendChild(div);
    });

    async function generateAll() {
        const status = document.getElementById('status');
        status.textContent = '⏳ جاري التوليد...';
        const img = new Image();
        const svgBlob = new Blob([SVG], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);
        await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
            img.src = url;
        });

        for (const s of SIZES) {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = s.size;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, s.size, s.size);
            const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = s.name;
            a.click();
            URL.revokeObjectURL(a.href);
            await new Promise(r => setTimeout(r, 150));
        }
        status.textContent = '✅ تم تحميل جميع الأيقونات! ضعها في مجلد icons/';
    }

    document.getElementById('gen').onclick = generateAll;
    </script>
</body>
</html>
